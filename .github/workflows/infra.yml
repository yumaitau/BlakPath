name: Infrastructure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: '1.10.5'
  TF_IN_AUTOMATION: 'true'

jobs:
  validate:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate
        run: |
          set -euo pipefail
          for stack in live/pilot live/staging live/account-baseline; do
            terraform -chdir="infra/terraform/${stack}" init -input=false -backend=false
            terraform -chdir="infra/terraform/${stack}" validate
          done

  plan:
    name: Terraform plan
    needs: validate
    if: vars.BLAKPATH_AWS_PLAN_ROLE_ARN != '' && vars.BLAKPATH_TF_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stack: [pilot, account-baseline]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BLAKPATH_AWS_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Plan
        working-directory: infra/terraform/live/${{ matrix.stack }}
        env:
          REQUIRE_CLEAN: ${{ vars.BLAKPATH_PLAN_MUST_BE_CLEAN }}
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config="bucket=${{ vars.BLAKPATH_TF_STATE_BUCKET }}" -backend-config="key=${{ matrix.stack }}/terraform.tfstate" -backend-config="region=ap-southeast-2" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode -no-color
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          if [ "$code" -eq 2 ] && [ "$REQUIRE_CLEAN" = "true" ]; then
            echo "Plan has changes and BLAKPATH_PLAN_MUST_BE_CLEAN is true."
            exit 2
          fi
