name: Deploy

# Operator-triggered. scripts/eks-deploy.sh runs the release gate Job, then
# the release-pinned migrate Job, then rolls web and worker. Every step uses
# the same image digests; a failed step leaves the Deployments unchanged.
on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'App image digest (sha256 hex, without the sha256: prefix)'
        required: true
        type: string
      worker_image_digest:
        description: 'Worker image digest (sha256 hex, without the sha256: prefix)'
        required: true
        type: string
      release_id:
        description: Git commit SHA
        required: true
        type: string

# One rollout at a time. A failed release gate or migration must not be
# cancelled into a partial apply.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24.21.0'
  PNPM_VERSION: '9.12.0'
  IMAGE_REPOSITORY: 959038055523.dkr.ecr.ap-southeast-2.amazonaws.com/blakpath

jobs:
  rollout:
    name: Release gate, migrate, then roll out
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure cluster access
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "${KUBECONFIG_CONTENT}" ]; then
            echo "GitHub environment secret KUBECONFIG is not set. Refusing to roll out."
            exit 1
          fi
          mkdir -p "${HOME}/.kube"
          printf '%s\n' "${KUBECONFIG_CONTENT}" > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Release gate, migrate, then roll web and worker
        env:
          IMAGE: ${{ env.IMAGE_REPOSITORY }}/app@sha256:${{ inputs.image_digest }}
          WORKER_IMAGE: ${{ env.IMAGE_REPOSITORY }}/worker@sha256:${{ inputs.worker_image_digest }}
          RELEASE_ID: ${{ inputs.release_id }}
          ENVIRONMENT: production
          # Overlay tokens. Set as variables on the GitHub `production`
          # environment; they are not committed (docs/eks-runbook.md).
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          S3_BUCKET_EVIDENCE: ${{ vars.S3_BUCKET_EVIDENCE }}
          S3_BUCKET_QUARANTINE: ${{ vars.S3_BUCKET_QUARANTINE }}
          S3_BUCKET_AUDIT_ANCHORS: ${{ vars.S3_BUCKET_AUDIT_ANCHORS }}
          S3_KMS_KEY_ID: ${{ vars.S3_KMS_KEY_ID }}
        run: bash scripts/eks-deploy.sh
