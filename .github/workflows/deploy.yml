name: Deploy

# Operator-triggered. scripts/eks-deploy.sh runs the release gate Job, then
# the release-pinned migrate Job, then rolls web and worker. Every step uses
# the same image digests; a failed step leaves the Deployments unchanged.
on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'App image digest (sha256 hex, without the sha256: prefix)'
        required: true
        type: string
      worker_image_digest:
        description: 'Worker image digest (sha256 hex, without the sha256: prefix)'
        required: true
        type: string
      release_id:
        description: Git commit SHA
        required: true
        type: string

# One rollout at a time. A failed release gate or migration must not be
# cancelled into a partial apply.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24.21.0'
  PNPM_VERSION: '9.12.0'
  IMAGE_REPOSITORY: 959038055523.dkr.ecr.ap-southeast-2.amazonaws.com/blakpath

jobs:
  rollout:
    name: Release gate, migrate, then roll out
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure cluster access
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "${KUBECONFIG_CONTENT}" ]; then
            echo "GitHub environment secret KUBECONFIG is not set. Refusing to roll out."
            exit 1
          fi
          mkdir -p "${HOME}/.kube"
          printf '%s\n' "${KUBECONFIG_CONTENT}" > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Release gate, migrate, then roll web and worker
        env:
          IMAGE: ${{ env.IMAGE_REPOSITORY }}/app@sha256:${{ inputs.image_digest }}
          WORKER_IMAGE: ${{ env.IMAGE_REPOSITORY }}/worker@sha256:${{ inputs.worker_image_digest }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: bash scripts/eks-deploy.sh
