name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly disclosed CVEs surface even without a push.
    - cron: '0 17 * * 1' # Mondays 03:00 ap-southeast-2 (UTC+10)

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'

jobs:
  # ---------------------------------------------------------------------------
  # Dependency vulnerability scan: pnpm audit + OSV Scanner.
  # ---------------------------------------------------------------------------
  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking gate: fail the build on any high/critical advisory in the
      # PRODUCTION dependency tree. Advisories that are justified-ignored live in
      # package.json `pnpm.auditConfig.ignoreGhsas` (currently GHSA-q7rr-3cgh-j5r3
      # — an OpenTelemetry Prometheus-exporter crash; BlakPath ships only the
      # OTLP/HTTP exporter, so the vulnerable path is never loaded).
      - name: pnpm audit (fail on high/critical)
        run: pnpm audit --prod --audit-level high

      # Informational depth scan. OSV does not honour pnpm's ignore list and
      # also reports moderate advisories, so it is non-blocking — pnpm audit
      # above is the gate. Surfaced in the job log for triage.
      - name: OSV Scanner (informational)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --recursive
            ./

  # ---------------------------------------------------------------------------
  # Secret scanning with Gitleaks.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned Gitleaks release. Run the CLI directly rather than
      # gitleaks/gitleaks-action, which requires a paid GITLEAKS_LICENSE for
      # organisation-owned repositories — the CLI has no such gate.
      GITLEAKS_VERSION: '8.21.2'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Gitleaks can scan past commits.
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks (scan full history, fail on any finding)
        run: gitleaks detect --source . --redact --no-banner --verbose --exit-code 1

  # ---------------------------------------------------------------------------
  # Container image scan (Trivy) + SBOM generation (Syft).
  # ---------------------------------------------------------------------------
  container:
    name: Container scan & SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image (runner target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: false
          load: true
          tags: blakpath:ci
          # These public placeholders satisfy Next.js route validation while
          # building. They exist only in the intermediate build stage.
          build-args: |
            DATABASE_URL=postgres://blakpath:blakpath@localhost:5432/blakpath
            REDIS_URL=redis://localhost:6379
            BETTER_AUTH_SECRET=ci-build-secret-value-at-least-32-characters-long
            ENCRYPTION_MASTER_KEY=dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3QtMTIzNDU=
            S3_ACCESS_KEY_ID=test
            S3_SECRET_ACCESS_KEY=test-secret
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blakpath:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload web Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-web

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: worker
          push: false
          load: true
          tags: blakpath-worker:ci
          cache-from: type=gha,scope=blakpath-worker
          cache-to: type=gha,mode=max,scope=blakpath-worker

      - name: Trivy worker vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blakpath-worker:ci
          format: sarif
          output: trivy-worker-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Upload worker Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-worker-results.sarif
          category: trivy-worker

      - name: Trivy scan web (gate — fail on CRITICAL,HIGH)
        id: trivy-web
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blakpath:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # The SARIF step already installed Trivy. Avoid a second setup and
          # keep this gate independent of setup-action availability.
          skip-setup-trivy: true

      - name: Trivy scan worker (gate — fail on CRITICAL,HIGH)
        id: trivy-worker
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blakpath-worker:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Generate web SBOM (Syft, SPDX JSON)
        uses: anchore/sbom-action@v0.17.7
        with:
          image: blakpath:ci
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload web SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-json
          path: sbom.spdx.json
          retention-days: 90

      - name: Generate worker SBOM (Syft, SPDX JSON)
        uses: anchore/sbom-action@v0.17.7
        with:
          image: blakpath-worker:ci
          format: spdx-json
          output-file: sbom-worker.spdx.json

      - name: Upload worker SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-worker-spdx-json
          path: sbom-worker.spdx.json
          retention-days: 90

      - name: Fail if an image scan failed
        if: ${{ steps.trivy-web.outcome == 'failure' || steps.trivy-worker.outcome == 'failure' }}
        run: exit 1
