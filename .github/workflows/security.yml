name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Weekly re-scan so newly disclosed CVEs surface even without a push.
    - cron: '0 17 * * 1' # Mondays 03:00 ap-southeast-2 (UTC+10)

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.21.0'
  PNPM_VERSION: '9.12.0'

jobs:
  # ---------------------------------------------------------------------------
  # Dependency vulnerability scan: pnpm audit + OSV Scanner.
  # ---------------------------------------------------------------------------
  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking gate: fail the build on any high/critical advisory in the
      # PRODUCTION dependency tree. Justified ignores live in
      # package.json `pnpm.auditConfig.ignoreGhsas` and each needs a row in
      # docs/supply-chain.md. The list is empty: GHSA-q7rr-3cgh-j5r3 was removed
      # when the OpenTelemetry v2 upgrade (#30) landed. Override floors (for
      # example @grpc/grpc-js) are documented there too.
      # .pnpmfile.cjs drops better-auth's optional vitest peer so the test
      # runner is not part of this production tree.
      - name: pnpm audit (fail on high/critical)
        run: pnpm audit --prod --audit-level high

      # Informational depth scan. OSV does not honour pnpm's ignore list and
      # also reports moderate advisories, so it is non-blocking — pnpm audit
      # above is the gate. Surfaced in the job log for triage.
      - name: OSV Scanner (informational)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --recursive
            ./

  # ---------------------------------------------------------------------------
  # Secret scanning with Gitleaks.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned Gitleaks release. Run the CLI directly rather than
      # gitleaks/gitleaks-action, which requires a paid GITLEAKS_LICENSE for
      # organisation-owned repositories — the CLI has no such gate.
      GITLEAKS_VERSION: '8.21.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so Gitleaks can scan past commits.
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks (scan full history, fail on any finding)
        run: gitleaks detect --source . --redact --no-banner --verbose --exit-code 1

  # ---------------------------------------------------------------------------
  # Container image scan (Trivy) + SBOM generation (Syft).
  # ---------------------------------------------------------------------------
  container:
    name: Container scan & SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build web image (runner target)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: false
          load: true
          tags: blakpath:ci
          # These public placeholders satisfy Next.js route validation while
          # building. They exist only in the intermediate build stage.
          build-args: |
            DATABASE_URL=postgres://blakpath:blakpath@localhost:5432/blakpath
            REDIS_URL=redis://localhost:6379
            BETTER_AUTH_SECRET=ci-build-secret-value-at-least-32-characters-long
            ENCRYPTION_MASTER_KEY=Ymxha3BhdGgtY2ktdGVzdC1tYXN0ZXIta2V5LTMyYiE=
            S3_ACCESS_KEY_ID=test
            S3_SECRET_ACCESS_KEY=test-secret
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: blakpath:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy scan (gate — fail on CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: blakpath:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          # The SARIF step already installed Trivy. Avoid a second setup and
          # keep this gate independent of setup-action availability.
          skip-setup-trivy: true

      - name: Generate SBOM (Syft, SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: blakpath:ci
          format: spdx-json
          output-file: sbom.spdx.json
