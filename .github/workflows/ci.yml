name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.21.0'
  PNPM_VERSION: '9.12.0'

jobs:
  # ---------------------------------------------------------------------------
  # Static checks: typecheck, lint, formatting. Fast, no services required.
  # ---------------------------------------------------------------------------
  static:
    name: Typecheck, lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unused dependencies
        run: pnpm deps:check

      - name: Migration journal matches schema
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
        run: pnpm db:drift

  # ---------------------------------------------------------------------------
  # Unit + integration tests. Integration tests get real Postgres + Redis.
  # ---------------------------------------------------------------------------
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blakpath
          POSTGRES_PASSWORD: blakpath
          POSTGRES_DB: blakpath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blakpath -d blakpath_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      ALLOW_DEV_SEED: '1'
      DATABASE_URL: postgres://blakpath:blakpath@localhost:5432/blakpath_test
      REDIS_URL: redis://localhost:6379
      # Test-only secrets — never real. Satisfy env validation at import time.
      BETTER_AUTH_SECRET: ci-test-secret-value-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      ENCRYPTION_MASTER_KEY: Ymxha3BhdGgtY2ktdGVzdC1tYXN0ZXIta2V5LTMyYiE=
      ENCRYPTION_KEY_VERSION: '1'
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test-secret
      CLAMAV_HOST: localhost
      SMTP_HOST: localhost
      RUN_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Seed development bootstrap
        run: pnpm db:seed

      - name: Run tests with coverage
        # pnpm 9 treats a bare `--coverage` as its own option and rejects it.
        # The separator forwards the flag to `vitest run`.
        run: pnpm test -- --coverage

  # ---------------------------------------------------------------------------
  # Production build. Ensures the Next.js standalone output compiles.
  # ---------------------------------------------------------------------------
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [static]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Build-time env only; no real secrets. The app validates env lazily.
      DATABASE_URL: postgres://blakpath:blakpath@localhost:5432/blakpath
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-build-secret-value-at-least-32-characters-long
      ENCRYPTION_MASTER_KEY: Ymxha3BhdGgtY2ktdGVzdC1tYXN0ZXIta2V5LTMyYiE=
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle release gate
        run: pnpm release:check:bundle

      - name: Build
        run: pnpm build

  e2e:
    name: Browser and accessibility acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test, build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blakpath
          POSTGRES_PASSWORD: blakpath
          POSTGRES_DB: blakpath_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blakpath -d blakpath_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Runtime profile stays development: the production release gate needs
      # real KMS, SES and managed S3. The server is still a production build
      # (see the build step), served by `next start`, not `next dev`.
      NODE_ENV: development
      PLAYWRIGHT_SERVER: production
      NEXT_TELEMETRY_DISABLED: '1'
      ALLOW_DEV_SEED: '1'
      DATABASE_URL: postgres://blakpath:blakpath@localhost:5432/blakpath_e2e
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-e2e-secret-value-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      ENCRYPTION_MASTER_KEY: Ymxha3BhdGgtY2ktdGVzdC1tYXN0ZXIta2V5LTMyYiE=
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test-secret
      CLAMAV_HOST: localhost
      SMTP_HOST: localhost
      RUN_EVIDENCE_E2E: 'true'
      # Federated sign-in journey against the in-test mock IdP (no real tenant).
      SSO_ENTRA_CLIENT_ID: e2e-mock-client
      SSO_ENTRA_CLIENT_SECRET: e2e-mock-client-secret
      SSO_STATE_SECRET: ci-e2e-sso-state-secret-at-least-32-characters
      SSO_E2E_IDP_PORT: '4455'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build production server
        # `next build` must run as production. Playwright then serves this
        # output with `next start`, which uses far less memory than `next dev`
        # and has no on-demand compilation.
        env:
          NODE_ENV: production
        run: pnpm build
      - name: Start evidence object storage
        run: |
          # Same digest as docker-compose.yml. Docker Hub no longer serves MinIO.
          docker run -d --name blakpath-e2e-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=test \
            -e MINIO_ROOT_PASSWORD=test-secret \
            chainguard/minio@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56 server /data
          for attempt in {1..30}; do
            curl -fsS http://localhost:9000/minio/health/ready && break
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            chainguard/minio@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56 -c '
            mc alias set local http://localhost:9000 test test-secret &&
            mc mb --ignore-existing local/blakpath-quarantine local/blakpath-evidence
          '
      - run: pnpm db:migrate && pnpm db:seed
      - name: Generate CoA development signing key
        run: |
          KEY="$(node -e "console.log(require('node:crypto').generateKeyPairSync('rsa',{modulusLength:2048}).privateKey.export({type:'pkcs8',format:'pem'}))")"
          {
            echo 'COA_SIGNING_LOCAL_KEY_PEM<<EOF'
            printf '%s\n' "$KEY"
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/

  # Production image smoke. The browser suite above serves a production build
  # with `next start`; this job builds the Dockerfile runner target and talks
  # to that container.
  e2e-smoke:
    name: Production image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [test, build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blakpath
          POSTGRES_PASSWORD: blakpath
          POSTGRES_DB: blakpath_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blakpath -d blakpath_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Host migrate/seed must stay development. The image sets NODE_ENV=production.
      NODE_ENV: development
      DATABASE_URL: postgres://blakpath:blakpath@localhost:5432/blakpath_e2e
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-e2e-secret-value-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      ENCRYPTION_MASTER_KEY: dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3QtMTIzNDU=
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build runner image
        run: |
          docker build --target runner -t blakpath-e2e:smoke \
            --build-arg DATABASE_URL \
            --build-arg REDIS_URL \
            --build-arg BETTER_AUTH_SECRET \
            --build-arg ENCRYPTION_MASTER_KEY \
            --build-arg S3_ACCESS_KEY_ID \
            --build-arg S3_SECRET_ACCESS_KEY \
            .
      - run: pnpm db:migrate && pnpm db:seed
      - name: Start production web container
        run: |
          docker run -d --name blakpath-e2e-web --network host \
            -e DATABASE_URL=postgres://blakpath:blakpath@127.0.0.1:5432/blakpath_e2e \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e BETTER_AUTH_SECRET \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e APP_URL=http://localhost:3000 \
            -e ENCRYPTION_MASTER_KEY \
            -e ENCRYPTION_KEY_VERSION=1 \
            blakpath-e2e:smoke
          ready=0
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/live; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
      - run: pnpm test:e2e:smoke
      - name: Upload production smoke report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-smoke-report
          path: playwright-report/
      - name: Container logs
        if: failure()
        run: docker logs blakpath-e2e-web || true
      - name: Stop production web container
        if: always()
        run: docker rm -f blakpath-e2e-web || true

  # ---------------------------------------------------------------------------
  # EKS manifests. Kustomize must build cleanly; no cluster required.
  # ---------------------------------------------------------------------------
  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
      - name: Build kustomization
        run: |
          kubectl kustomize infra/k8s > /dev/null
          kubectl kustomize infra/k8s/cluster > /dev/null
          kubectl kustomize infra/k8s/release-check > /dev/null
          echo "kustomize build OK"
