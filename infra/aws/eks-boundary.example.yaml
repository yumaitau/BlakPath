AWSTemplateFormatVersion: '2010-09-09'
Description: >
  BlakPath secret sync and application mail. The External Secrets role can
  read only /blakpath/production/* and only from the blakpath namespace.
  The shared External Secrets role is denied that folder and the app-secrets
  key. Mail send is ses:SendEmail for one From address on the workload role.
  This stack does not create an SMTP user or an access key.

Parameters:
  AppSecretsKeyArn:
    Type: String
    Description: CMK for /blakpath/production/* (alias/blakpath-app-secrets).
    AllowedPattern: '^arn:aws:kms:ap-southeast-2:\d{12}:key/[0-9a-fA-F-]+$'
  PlatformEsoRoleName:
    Type: String
    Description: Shared External Secrets role. Never a BlakPath role.
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]+$'
  WorkloadRoleName:
    Type: String
    Default: blakpath-eks-runtime
    Description: Existing pod role for service account blakpath.
  WorkloadRoleArn:
    Type: String
    Default: arn:aws:iam::111122223333:role/blakpath-eks-runtime
    Description: ARN of WorkloadRoleName. Replace the placeholder when the association is created.
    AllowedPattern: '^arn:aws:iam::\d{12}:role/[A-Za-z0-9+=,.@_-]+$'
  ClusterName:
    Type: String
    Default: yumait-prod
    Description: Cluster that will own the pod identity association.
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
  CreatePodIdentityAssociation:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      true only after namespace blakpath exists. Delete a leftover association
      for this service account before setting true.
  MailFromDomain:
    Type: String
    Default: blakpath.yumait.au
  MailFromAddress:
    Type: String
    Default: no-reply@blakpath.yumait.au

Rules:
  DenyStaysOffBlakPathRoles:
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Equals:
                - !Ref PlatformEsoRoleName
                - blakpath-external-secrets
        AssertDescription: Do not attach the deny policy to blakpath-external-secrets.
      - Assert:
          Fn::Not:
            - Fn::Equals:
                - !Ref PlatformEsoRoleName
                - !Ref WorkloadRoleName
        AssertDescription: Do not attach the deny policy to the workload role.
      - Assert:
          Fn::Or:
            - Fn::Equals:
                - !Ref CreatePodIdentityAssociation
                - 'false'
            - Fn::Not:
                - Fn::Equals:
                    - !Ref WorkloadRoleArn
                    - arn:aws:iam::111122223333:role/blakpath-eks-runtime
        AssertDescription: Set WorkloadRoleArn when creating the pod identity association.

Conditions:
  AssociateWorkload: !Equals [!Ref CreatePodIdentityAssociation, 'true']

Resources:
  ExternalSecretsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: blakpath-external-secrets
      Description: Reads /blakpath/production/* for the blakpath namespace only.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowBlakPathExternalSecretsServiceAccount
            Effect: Allow
            Principal:
              # Replace OIDC_ID with the cluster issuer id before deploy.
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/oidc.eks.ap-southeast-2.amazonaws.com/id/OIDC_ID
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'oidc.eks.ap-southeast-2.amazonaws.com/id/OIDC_ID:sub': system:serviceaccount:blakpath:blakpath-external-secrets
                'oidc.eks.ap-southeast-2.amazonaws.com/id/OIDC_ID:aud': sts.amazonaws.com
      Policies:
        - PolicyName: ReadBlakPathProductionSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadBlakPathProductionFolder
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:ListSecretVersionIds
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/blakpath/production/*
              - Sid: DecryptAppSecretsKey
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref AppSecretsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com

  PlatformEsoBlakPathDeny:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: BlakPathSecretSyncDeny
      Roles:
        - !Ref PlatformEsoRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyPlatformEsoBlakPathSecrets
            Effect: Deny
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
              - secretsmanager:GetResourcePolicy
              - secretsmanager:ListSecretVersionIds
            Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/blakpath/production/*
          - Sid: DenyPlatformEsoAppSecretsKey
            Effect: Deny
            Action: kms:Decrypt
            Resource: !Ref AppSecretsKeyArn

  WorkloadMailSend:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: BlakPathSesSend
      Roles:
        - !Ref WorkloadRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SendFromApplicationIdentity
            Effect: Allow
            Action: ses:SendEmail
            Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${MailFromDomain}
            Condition:
              StringEquals:
                ses:FromAddress: !Ref MailFromAddress

  WorkloadPodIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    Condition: AssociateWorkload
    Properties:
      ClusterName: !Ref ClusterName
      Namespace: blakpath
      ServiceAccount: blakpath
      RoleArn: !Ref WorkloadRoleArn

Outputs:
  ExternalSecretsRoleArn:
    Value: !GetAtt ExternalSecretsRole.Arn
  WorkloadTrustPolicy:
    Description: Replace CLUSTER_NAME, then set this trust on the workload role.
    Value: infra/aws/blakpath-eks-runtime-trust.example.json
