AWSTemplateFormatVersion: '2010-09-09'
Description: Least-privilege BlakPath ECS workload roles with no standing access keys.

Parameters:
  EvidenceBucketArn:
    Type: String
  QuarantineBucketArn:
    Type: String
  EvidenceKmsKeyArn:
    Type: String
  AuditAnchorBucketArn:
    Type: String
  AuditAnchorSigningKeyArn:
    Type: String
  RuntimeSecretArn:
    Type: String
  RuntimeSecretKmsKeyArn:
    Type: String
  # Informational. Tenant and platform envelope calls are authorised by the
  # encryption-context condition below, because BYOK / XKS ARNs are not known
  # when this role is deployed. The customer key policy must grant this role
  # kms:Decrypt, kms:Encrypt, kms:GenerateDataKey and kms:DescribeKey.
  # DescribeKey has no encryption context, so it is a separate statement on
  # the worker role only. S3 object encryption uses the tenant CMK via
  # kms:ViaService, not the purpose condition.
  PlatformKmsKeyArn:
    Type: String

Resources:
  WebTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BlakPathWebEvidenceAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BucketReadiness
                Effect: Allow
                Action: s3:ListBucket
                Resource: [!Ref EvidenceBucketArn]
              - Sid: QuarantineUploads
                Effect: Allow
                Action: s3:PutObject
                Resource: [!Sub '${QuarantineBucketArn}/*']
              - Sid: CleanEvidenceDownloads
                Effect: Allow
                Action: s3:GetObject
                Resource: [!Sub '${EvidenceBucketArn}/*']
              - Sid: EvidenceKms
                Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
                Resource: [!Ref EvidenceKmsKeyArn]
              - Sid: PlatformEnvelopeKey
                Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: [!Ref PlatformKmsKeyArn]
              - Sid: TenantEnvelopeKeys
                Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:EncryptionContext:purpose:
                      - field
                      - platform
                      - blind-index
                      - key_validation
              - Sid: TenantObjectSse
                Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: s3.ap-southeast-2.amazonaws.com
                  StringLike:
                    kms:EncryptionContext:aws:s3:arn:
                      - !Sub '${EvidenceBucketArn}/*'
                      - !Sub '${QuarantineBucketArn}/*'

  WorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BlakPathWorkerEvidenceLifecycle
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BucketReadiness
                Effect: Allow
                Action: s3:ListBucket
                Resource: [!Ref EvidenceBucketArn, !Ref QuarantineBucketArn]
              - Sid: QuarantineReadDelete
                Effect: Allow
                Action: [s3:GetObject, s3:DeleteObject]
                Resource: [!Sub '${QuarantineBucketArn}/*']
              - Sid: EvidencePromote
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: [!Sub '${EvidenceBucketArn}/*']
              - Sid: EvidenceKms
                Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
                Resource: [!Ref EvidenceKmsKeyArn]
              - Sid: AuditAnchorReadWrite
                Effect: Allow
                Action: [s3:ListBucket]
                Resource: [!Ref AuditAnchorBucketArn]
              - Sid: AuditAnchorObjects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: [!Sub '${AuditAnchorBucketArn}/*']
              - Sid: AuditAnchorSign
                Effect: Allow
                Action: [kms:Sign, kms:GetPublicKey, kms:DescribeKey]
                Resource: [!Ref AuditAnchorSigningKeyArn]
              - Sid: AuditAnchorNoDelete
                Effect: Deny
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:BypassGovernanceRetention
                Resource:
                  - !Ref AuditAnchorBucketArn
                  - !Sub '${AuditAnchorBucketArn}/*'
              - Sid: PlatformEnvelopeKey
                Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: [!Ref PlatformKmsKeyArn]
              - Sid: TenantEnvelopeKeys
                Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:EncryptionContext:purpose:
                      - field
                      - platform
                      - blind-index
                      - key_validation
              - Sid: TenantObjectSse
                Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: s3.ap-southeast-2.amazonaws.com
                  StringLike:
                    kms:EncryptionContext:aws:s3:arn:
                      - !Sub '${EvidenceBucketArn}/*'
                      - !Sub '${QuarantineBucketArn}/*'
              - Sid: TenantKeyDescribe
                Effect: Allow
                Action: kms:DescribeKey
                Resource: '*'

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadRuntimeSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref RuntimeSecretArn]
              - Effect: Allow
                Action: kms:Decrypt
                Resource: [!Ref RuntimeSecretKmsKeyArn]

Outputs:
  WebTaskRoleArn:
    Value: !GetAtt WebTaskRole.Arn
  WorkerTaskRoleArn:
    Value: !GetAtt WorkerTaskRole.Arn
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
