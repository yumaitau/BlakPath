apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath-otel-collector
  namespace: blakpath
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::959038055523:role/blakpath-otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: blakpath-otel-collector
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blakpath-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blakpath-otel-collector
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-otel-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: blakpath-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blakpath-otel-collector
    spec:
      serviceAccountName: blakpath-otel-collector
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adot
          image: public.ecr.aws/aws-observability/aws-otel-collector:v0.50.0
          imagePullPolicy: IfNotPresent
          args: ['--config=/etc/otel/collector.yaml']
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          volumeMounts:
            - name: config
              mountPath: /etc/otel/collector.yaml
              subPath: collector.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: blakpath-otel-collector
        - name: tmp
          emptyDir: {}
