# ClamAV scanner. Two replicas, each with its own signature volume, so a node
# drain leaves one pod Ready. The ServiceAccount has no IRSA annotation and
# mounts no API token. Do not add a Pod Identity association or a cloud role.
# Image digest is the 1.4_base manifest list resolved 2026-10-14. The base tag
# has no baked signatures; the volume is the database.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath-clamav
  namespace: blakpath
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blakpath-clamav-config
  namespace: blakpath
data:
  clamd.conf: |
    LocalSocket /tmp/clamd.sock
    TCPSocket 3310
    TCPAddr 0.0.0.0
    User clamav
    LogFile /var/log/clamav/clamd.log
    LogTime yes
    DatabaseDirectory /var/lib/clamav
    ConcurrentDatabaseReload no
  freshclam.conf: |
    DatabaseOwner clamav
    UpdateLogFile /var/log/clamav/freshclam.log
    NotifyClamd /etc/clamav/clamd.conf
    DatabaseDirectory /var/lib/clamav
    ScriptedUpdates no
    Checks 12
    PrivateMirror http://blakpath-clamav-mirror:8080
---
apiVersion: v1
kind: Service
metadata:
  name: blakpath-clamav-headless
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-clamav
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: blakpath-clamav
  ports:
    - name: clamav
      port: 3310
      targetPort: clamav
---
apiVersion: v1
kind: Service
metadata:
  name: blakpath-clamav
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-clamav
spec:
  type: ClusterIP
  # Ready pods only. Readiness is a clamd PING, so this Service has no
  # endpoints until clamd answers.
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: blakpath-clamav
  ports:
    - name: clamav
      port: 3310
      targetPort: clamav
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: blakpath-clamav
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-clamav
spec:
  serviceName: blakpath-clamav-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: blakpath-clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blakpath-clamav
    spec:
      serviceAccountName: blakpath-clamav
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: blakpath-clamav
              topologyKey: kubernetes.io/hostname
      volumes:
        - name: config
          configMap:
            name: blakpath-clamav-config
        # Root filesystem is read-only. clamd and freshclam write only the
        # socket and initial freshclam config (/tmp), logs and the signature
        # volume.
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
      containers:
        - name: clamav
          image: clamav/clamav-debian:1.4_base@sha256:66ea2d47620f5458702e31d793999b8f05cdd93327336136c36ef6dc52483217
          imagePullPolicy: IfNotPresent
          command: ['/init-unprivileged']
          env:
            - name: CLAMAV_NO_MILTERD
              value: 'true'
            - name: FRESHCLAM_CHECKS
              value: '12'
            - name: CLAMD_STARTUP_TIMEOUT
              value: '1800'
          ports:
            - containerPort: 3310
              name: clamav
          volumeMounts:
            - name: config
              mountPath: /etc/clamav/clamd.conf
              subPath: clamd.conf
              readOnly: true
            - name: config
              mountPath: /etc/clamav/freshclam.conf
              subPath: freshclam.conf
              readOnly: true
            - name: signatures
              mountPath: /var/lib/clamav
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/clamav
          # No liveness probe. ConcurrentDatabaseReload is off, so a signature
          # reload stops answering PING until it finishes. Failing liveness
          # there would restart the pod and drop the database we just updated.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: '2'
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
  volumeClaimTemplates:
    - metadata:
        name: signatures
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 2Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blakpath-clamav
  namespace: blakpath
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blakpath-clamav
---
# ClamAV slice of the namespace network policy (#60). Ingress is web and worker
# only. Egress is the private signature mirror plus DNS. The allow list does
# not include node IMDS or the EKS Pod Identity address. 169.254.20.10 is
# NodeLocal DNSCache, port 53 only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blakpath-clamav
  namespace: blakpath
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blakpath-clamav
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: blakpath-app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: blakpath-worker
      ports:
        - protocol: TCP
          port: 3310
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: blakpath-clamav-mirror
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 169.254.20.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
