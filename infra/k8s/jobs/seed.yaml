# Production seed: permission catalogue + system role templates only.
# Developer bootstrap is refused when NODE_ENV=production (see src/db/seeds).
# Image digest comes from components/images (worker), via
# `kubectl kustomize infra/k8s`. Delete this Job before a new digest.
apiVersion: batch/v1
kind: Job
metadata:
  name: blakpath-seed
  namespace: blakpath
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: blakpath
      restartPolicy: Never
      containers:
        - name: seed
          image: 959038055523.dkr.ecr.ap-southeast-2.amazonaws.com/blakpath/worker
          imagePullPolicy: IfNotPresent
          command: [pnpm, exec, tsx, src/db/seeds/index.ts]
          envFrom:
            - configMapRef:
                name: blakpath-config
            - secretRef:
                name: blakpath-runtime
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
