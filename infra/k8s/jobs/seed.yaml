# Production seed: permission catalogue + system role templates only.
# Developer accounts require ALLOW_DEV_SEED=1 and a loopback database host.
# NODE_ENV=production never creates them (see src/db/seeds).
#   kubectl apply -f infra/k8s/jobs/seed.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: blakpath-seed
  namespace: blakpath
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: blakpath
      restartPolicy: Never
      containers:
        - name: seed
          image: 959038055523.dkr.ecr.ap-southeast-2.amazonaws.com/blakpath/worker:4676c43
          imagePullPolicy: IfNotPresent
          command: [pnpm, exec, tsx, src/db/seeds/index.ts]
          envFrom:
            - configMapRef:
                name: blakpath-config
            - secretRef:
                name: blakpath-runtime
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
