# Schema migration. The image digest comes from components/images (worker).
# Applied with `kubectl kustomize infra/k8s`. Delete this Job before applying
# a new digest; a Job pod template is immutable.
apiVersion: batch/v1
kind: Job
metadata:
  name: blakpath-migrate
  namespace: blakpath
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: blakpath
      restartPolicy: Never
      containers:
        - name: migrate
          image: 959038055523.dkr.ecr.ap-southeast-2.amazonaws.com/blakpath/worker
          imagePullPolicy: IfNotPresent
          command: [pnpm, exec, tsx, src/db/migrate.ts]
          envFrom:
            - configMapRef:
                name: blakpath-config
            - secretRef:
                name: blakpath-runtime
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
