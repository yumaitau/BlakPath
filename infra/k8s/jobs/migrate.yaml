# Schema migration. Rendered by `kubectl kustomize infra/k8s`; the image
# digest comes from components/images (worker). Delete this Job before
# applying a new digest; a Job pod template is immutable.
# invite-admin is separate: `kubectl kustomize infra/k8s/jobs/invite-admin`.
apiVersion: batch/v1
kind: Job
metadata:
  name: blakpath-migrate
  namespace: blakpath
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: blakpath
      restartPolicy: Never
      containers:
        - name: migrate
          image: 959038055523.dkr.ecr.ap-southeast-2.amazonaws.com/blakpath/worker
          imagePullPolicy: IfNotPresent
          command: [pnpm, exec, tsx, src/db/migrate.ts]
          envFrom:
            - configMapRef:
                name: blakpath-config
            - secretRef:
                name: blakpath-runtime
          env:
            # Owning role. Must not be the application DATABASE_URL. The
            # runtime secret must not carry this value; web and worker never
            # mount blakpath-migrator.
            - name: DATABASE_MIGRATION_URL
              valueFrom:
                secretKeyRef:
                  name: blakpath-migrator
                  key: DATABASE_MIGRATION_URL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
