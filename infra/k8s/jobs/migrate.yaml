# Rendered by scripts/cd-release.sh. Do not kubectl apply this file directly.
# Not in kustomization.yaml: a Job is immutable and is named per release.
# __IMAGE__ is the app image digest. __RELEASE_ID__ is the git sha.
apiVersion: batch/v1
kind: Job
metadata:
  name: blakpath-migrate-__RELEASE_ID__
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-migrate
    app.kubernetes.io/part-of: blakpath
    blakpath.yumait.au/release: __RELEASE_ID__
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blakpath-migrate
        blakpath.yumait.au/release: __RELEASE_ID__
    spec:
      serviceAccountName: blakpath
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ['node', '/app/migrate.cjs']
          env:
            - name: NODE_ENV
              value: production
            - name: MIGRATIONS_FOLDER
              value: /app/migrations
            - name: MIGRATION_LOCK_TIMEOUT_MS
              value: '4000'
            - name: MIGRATION_STATEMENT_TIMEOUT_MS
              value: '600000'
            - name: DATABASE_MIGRATOR_URL
              valueFrom:
                secretKeyRef:
                  name: blakpath-migrator
                  key: DATABASE_MIGRATOR_URL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
