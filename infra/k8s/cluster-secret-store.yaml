# Cluster-scoped. Apply on its own after the External Secrets controller and
# the Pod Identity association exist:
#   kubectl apply -f infra/k8s/external-secrets-serviceaccount.yaml
#   kubectl apply -f infra/k8s/cluster-secret-store.yaml
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: blakpath
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: blakpath-external-secrets
            namespace: external-secrets
