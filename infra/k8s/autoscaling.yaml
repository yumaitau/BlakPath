apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blakpath-app
  namespace: blakpath
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blakpath-app
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blakpath-app
  namespace: blakpath
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blakpath-app
