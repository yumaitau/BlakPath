# Production release gate. scripts/eks-deploy.sh pins the images to the
# release digests before it renders this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blakpath
resources:
  - ../../../base/release-check
images:
  - name: blakpath/app
    newName: __ECR_REGISTRY__/blakpath/app
    newTag: __IMAGE_TAG__
  - name: blakpath/worker
    newName: __ECR_REGISTRY__/blakpath/worker
    newTag: __IMAGE_TAG__
