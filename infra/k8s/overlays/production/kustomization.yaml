# Production overlay. Bucket names and the evidence KMS key id are tokens.
# Substitute them, the ECR registry and the image tag from private CD config.
# See docs/eks-runbook.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blakpath
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: blakpath-config
  - path: ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: blakpath
  - path: externalsecret-patch.yaml
    target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: blakpath-runtime
images:
  - name: blakpath/app
    newName: __ECR_REGISTRY__/blakpath/app
    newTag: __IMAGE_TAG__
  - name: blakpath/worker
    newName: __ECR_REGISTRY__/blakpath/worker
    newTag: __IMAGE_TAG__
