apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blakpath-staging
resources:
  - ../../base
patches:
  - path: configmap-patch.yaml
  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: blakpath-runtime
      namespace: blakpath
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: /blakpath/staging/runtime
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: blakpath
      namespace: blakpath
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.blakpath.yumait.au
