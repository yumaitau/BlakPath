apiVersion: v1
kind: ConfigMap
metadata:
  name: blakpath-config
  namespace: blakpath
data:
  APP_URL: https://staging.blakpath.yumait.au
  BETTER_AUTH_URL: https://staging.blakpath.yumait.au
  SMTP_FROM: BlakPath <no-reply@staging.blakpath.yumait.au>
  S3_BUCKET_EVIDENCE: blakpath-staging-evidence-959038055523-ap-southeast-2
  S3_BUCKET_QUARANTINE: blakpath-staging-quarantine-959038055523-ap-southeast-2
  # Replaced before the first staging apply. release:check rejects this value.
  S3_KMS_KEY_ID: REPLACE_WITH_STAGING_CMK_ARN
  OTEL_SERVICE_NAME: blakpath-staging
