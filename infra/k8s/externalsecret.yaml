# External Secrets Operator: sync the Secrets Manager JSON secret into the
# runtime Secret consumed by web + worker via envFrom. Secret keys must match
# env var names exactly (DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET,
# ENCRYPTION_MASTER_KEY, SMTP_USER, SMTP_PASSWORD, EMAIL_WEBHOOK_SECRET).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blakpath-runtime
  namespace: blakpath
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: blakpath-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: blakpath-eks-runtime
