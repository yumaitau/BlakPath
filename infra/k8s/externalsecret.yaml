# External Secrets Operator: sync the Secrets Manager JSON secret into the
# runtime Secret consumed by web + worker via envFrom. Secret keys must match
# env var names exactly (DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET,
# EMAIL_WEBHOOK_SECRET, ORIGIN_VERIFY_SECRET, COA_SIGNING_KEY_ID,
# AUDIT_ANCHOR_SIGNING_KEY_ID). There is no mail credential: SES is called
# under the workload role, and `pnpm release:check` fails if SMTP_USER,
# SMTP_PASSWORD or PAPERBOY_* are present.
# DATABASE_MIGRATION_URL belongs in /blakpath/production/migrator, not here.
# ENCRYPTION_MASTER_KEY is optional and only for reading version-1 ciphertext.
#
# Foldering: every BlakPath secret lives under /blakpath/production/ in
# Secrets Manager. Sync goes through the namespaced store in secretstore.yaml,
# whose role can read that folder and decrypt alias/blakpath-app-secrets.
# Do not point this object at the shared cluster store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blakpath-runtime
  namespace: blakpath
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: blakpath-secrets
  target:
    name: blakpath-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: /blakpath/production/runtime
