# External Secrets Operator: sync the Secrets Manager JSON secret into the
# runtime Secret consumed by web + worker via envFrom. Secret keys must match
# env var names exactly (DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET,
# ENCRYPTION_MASTER_KEY, PAPERBOY_API_KEY, EMAIL_WEBHOOK_SECRET,
# COA_SIGNING_KEY_ID).
#
# Foldering: every BlakPath secret lives under /blakpath/production/ in
# Secrets Manager (dedicated namespace; nothing shared). The source secret
# itself is encrypted with the customer key alias/blakpath-app-secrets —
# no AWS-managed default keys anywhere in the secret path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blakpath-runtime
  namespace: blakpath
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: blakpath-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: /blakpath/production/runtime
