# External Secrets Operator: sync one Secrets Manager JSON secret into the
# runtime Secret consumed by web + worker. Requires a ClusterSecretStore named
# `blakpath` (region ap-southeast-2, IRSA-authenticated) installed separately.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blakpath-runtime-secret
  namespace: blakpath
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: blakpath
  target:
    name: blakpath-runtime-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /blakpath/production/runtime
