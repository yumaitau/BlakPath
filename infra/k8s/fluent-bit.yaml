# Ships blakpath container stdout to /blakpath/production/application.
# Reads host logs, so the container stays root. The log path is limited to
# the blakpath namespace by the CRI filename.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath-fluent-bit
  namespace: blakpath
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::959038055523:role/blakpath-fluent-bit
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: blakpath-fluent-bit
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blakpath-fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blakpath-fluent-bit
    spec:
      serviceAccountName: blakpath-fluent-bit
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:2.34.3.20261001
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/fluent-bit/state
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: state
          emptyDir: {}
        - name: config
          configMap:
            name: blakpath-fluent-bit
