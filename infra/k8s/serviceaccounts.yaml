apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath-web
  namespace: blakpath
  annotations:
    # Replace with the real IAM role ARN for the web workload (IRSA).
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/blakpath-web-ap-southeast-2
    eks.amazonaws.com/sts-regional-endpoints: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath-worker
  namespace: blakpath
  annotations:
    # Replace with the real IAM role ARN for the worker workload (IRSA).
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/blakpath-worker-ap-southeast-2
    eks.amazonaws.com/sts-regional-endpoints: "true"
