# One identity per workload. Pod Identity associations (see
# infra/aws/workload-roles.example.yaml) exist only for web and worker.
# ClamAV and migrate have no IAM role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath-web
  namespace: blakpath
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath-worker
  namespace: blakpath
---
# Scanner never calls AWS. No token, so it cannot assume a role even if an
# association is added by mistake.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath-clamav
  namespace: blakpath
automountServiceAccountToken: false
---
# Schema migrations and the production seed use the synced Postgres secret
# only. No AWS role, no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath-migrate
  namespace: blakpath
automountServiceAccountToken: false
