# blakpath has no AWS role (ClamAV). Web and worker each have a Pod Identity
# association created by infra/terraform/modules/pod_identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath
  namespace: blakpath
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath-web
  namespace: blakpath
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath-worker
  namespace: blakpath
