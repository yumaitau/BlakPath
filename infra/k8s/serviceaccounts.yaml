# One identity per workload. Pod Identity associations (see
# infra/aws/workload-roles.example.yaml) exist only for web and worker.
# ClamAV (clamav.yaml) and migrate have no IAM role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath-web
  namespace: blakpath
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath-worker
  namespace: blakpath
---
# Schema migrations and the production seed use the synced Postgres secrets
# only. No AWS role, no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath-migrate
  namespace: blakpath
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blakpath-external-secrets
  namespace: blakpath
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::959038055523:role/blakpath-external-secrets
