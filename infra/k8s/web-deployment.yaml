apiVersion: apps/v1
kind: Deployment
metadata:
  name: blakpath-app
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blakpath-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blakpath-app
    spec:
      serviceAccountName: blakpath
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
      containers:
        - name: web
          image: 959038055523.dkr.ecr.ap-southeast-2.amazonaws.com/blakpath/app:538319c
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: blakpath-config
            - secretRef:
                name: blakpath-runtime
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /app/.next/cache
              name: next-cache
          # Slow boot is a startup failure, not a liveness restart. Dependency
          # loss fails readiness only — /api/live does not touch RDS, Redis, S3
          # or ClamAV, so a blip cannot restart the web tier.
          startupProbe:
            httpGet:
              path: /api/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
