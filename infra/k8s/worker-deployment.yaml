apiVersion: apps/v1
kind: Deployment
metadata:
  name: blakpath-worker
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: blakpath-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blakpath-worker
    spec:
      serviceAccountName: blakpath-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      # tsx/esbuild scratch. HOME is /tmp so a read-only root has one writable path.
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: worker
          image: 959038055523.dkr.ecr.ap-southeast-2.amazonaws.com/blakpath/worker:4676c43
          imagePullPolicy: IfNotPresent
          command: [pnpm, exec, tsx, worker/index.ts]
          envFrom:
            - configMapRef:
                name: blakpath-config
            - secretRef:
                name: blakpath-runtime
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - mountPath: /tmp
              name: tmp
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blakpath-clamav
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-clamav
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blakpath-clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blakpath-clamav
    spec:
      serviceAccountName: blakpath-clamav
      automountServiceAccountToken: false
      # Image user clamav is uid/gid 1000. /init chowns as root and cannot
      # pass restricted PSA; /init-unprivileged is the vendor non-root entrypoint.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clamav
          image: clamav/clamav-debian:1.4
          command: [/init-unprivileged]
          ports:
            - containerPort: 3310
              name: clamav
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 1500m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: blakpath-clamav
  namespace: blakpath
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blakpath-clamav
  ports:
    - name: clamav
      port: 3310
      targetPort: clamav
