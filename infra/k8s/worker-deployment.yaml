apiVersion: apps/v1
kind: Deployment
metadata:
  name: blakpath-worker
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Surge is one extra pool in the connection budget.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blakpath-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blakpath-worker
    spec:
      # Longer than WORKER_SHUTDOWN_GRACE_SECONDS (25s). No preStop: SIGTERM
      # is what starts the job drain.
      terminationGracePeriodSeconds: 30
      serviceAccountName: blakpath
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: blakpath-worker
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: blakpath-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: 959038055523.dkr.ecr.ap-southeast-2.amazonaws.com/blakpath/worker:4676c43
          imagePullPolicy: IfNotPresent
          command: [pnpm, exec, tsx, worker/index.ts]
          envFrom:
            - configMapRef:
                name: blakpath-config
            - secretRef:
                name: blakpath-runtime
          # Overrides envFrom. The runtime secret must not raise the pool.
          env:
            - name: DATABASE_POOL_MAX
              valueFrom:
                configMapKeyRef:
                  name: blakpath-config
                  key: DATABASE_POOL_MAX
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blakpath-clamav
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-clamav
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blakpath-clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blakpath-clamav
    spec:
      serviceAccountName: blakpath
      # One replica today. The same hard spread applies if it is scaled.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: blakpath-clamav
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: blakpath-clamav
      containers:
        - name: clamav
          image: clamav/clamav-debian:1.4
          ports:
            - containerPort: 3310
              name: clamav
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 1500m
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: blakpath-clamav
  namespace: blakpath
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blakpath-clamav
  ports:
    - name: clamav
      port: 3310
      targetPort: clamav
