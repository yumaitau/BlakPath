apiVersion: apps/v1
kind: Deployment
metadata:
  name: blakpath-worker
  namespace: blakpath
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blakpath-worker
  template:
    metadata:
      labels:
        app: blakpath-worker
    spec:
      serviceAccountName: blakpath-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ACCOUNT_ID.dkr.ecr.ap-southeast-2.amazonaws.com/blakpath-worker:TAG
          imagePullPolicy: IfNotPresent
          command: [pnpm, worker]
          envFrom:
            - configMapRef:
                name: blakpath-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: blakpath-runtime-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: blakpath-runtime-secret
                  key: REDIS_URL
            - name: ENCRYPTION_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: blakpath-runtime-secret
                  key: ENCRYPTION_MASTER_KEY
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: blakpath-runtime-secret
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blakpath-runtime-secret
                  key: SMTP_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        # ClamAV runs as a sidecar so evidence scans stay in-region and
        # co-located with the worker. Size the pool for scan bursts.
        - name: clamav
          image: clamav/clamav:latest
          ports:
            - containerPort: 3310
              name: clamd
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 1500m
              memory: 2Gi
