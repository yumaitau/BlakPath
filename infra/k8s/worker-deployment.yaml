apiVersion: apps/v1
kind: Deployment
metadata:
  name: blakpath-worker
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blakpath-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blakpath-worker
    spec:
      serviceAccountName: blakpath
      # Must stay equal to worker TERMINATION_GRACE_SECONDS (630). That is
      # longer than the in-process drain, which is longer than the longest job.
      terminationGracePeriodSeconds: 630
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: worker
          image: 959038055523.dkr.ecr.ap-southeast-2.amazonaws.com/blakpath/worker:4676c43
          imagePullPolicy: IfNotPresent
          # No command override. The image ENTRYPOINT is tini, so SIGTERM
          # reaches node and the drain can log "shutdown complete".
          envFrom:
            - configMapRef:
                name: blakpath-config
            - secretRef:
                name: blakpath-runtime
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command: ['/app/scripts/worker-liveness.sh']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            exec:
              command: ['/app/scripts/worker-liveness.sh']
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blakpath-clamav
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-clamav
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blakpath-clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blakpath-clamav
    spec:
      serviceAccountName: blakpath
      containers:
        - name: clamav
          image: clamav/clamav-debian:1.4
          ports:
            - containerPort: 3310
              name: clamav
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 1500m
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: blakpath-clamav
  namespace: blakpath
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blakpath-clamav
  ports:
    - name: clamav
      port: 3310
      targetPort: clamav
