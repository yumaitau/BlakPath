apiVersion: apps/v1
kind: Deployment
metadata:
  name: blakpath-worker
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: blakpath-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blakpath-worker
    spec:
      serviceAccountName: blakpath-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      # tsx/esbuild scratch. HOME is /tmp so a read-only root has one writable path.
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: worker
          image: 959038055523.dkr.ecr.ap-southeast-2.amazonaws.com/blakpath/worker:4676c43
          imagePullPolicy: IfNotPresent
          command: [pnpm, exec, tsx, worker/index.ts]
          envFrom:
            - configMapRef:
                name: blakpath-config
            - secretRef:
                name: blakpath-runtime
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - mountPath: /tmp
              name: tmp
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
