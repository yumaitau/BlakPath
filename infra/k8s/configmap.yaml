apiVersion: v1
kind: ConfigMap
metadata:
  name: blakpath-config
  namespace: blakpath
data:
  APP_URL: https://blakpath.yumait.au
  APP_REGION: ap-southeast-2
  BETTER_AUTH_URL: https://blakpath.yumait.au
  HOSTNAME: 0.0.0.0
  PORT: '3000'
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: '1'
  LOG_LEVEL: info
  S3_REGION: ap-southeast-2
  S3_BUCKET_EVIDENCE: blakpath-prod-evidence-959038055523-ap-southeast-2
  S3_BUCKET_QUARANTINE: blakpath-prod-quarantine-959038055523-ap-southeast-2
  S3_BUCKET_AUDIT_ANCHORS: blakpath-prod-audit-anchors-959038055523-ap-southeast-2
  AUDIT_ANCHOR_OBJECT_LOCK: 'true'
  # Bucket default CMK only. Per-object SSE-KMS uses the tenant key.
  S3_KMS_KEY_ID: arn:aws:kms:ap-southeast-2:959038055523:key/737b7098-2c77-4a4e-b4c6-666597743651
  # Platform CMK for non-tenant envelope encryption. Not a secret.
  # Replace before production; release:check rejects a missing or local key.
  # PLATFORM_KMS_KEY_ARN: arn:aws:kms:ap-southeast-2:ACCOUNT:key/KEY_ID
  S3_FORCE_PATH_STYLE: 'false'
  # Relay host for non-production SMTP. Production mail uses ses:SendEmail
  # on the workload role; do not put SMTP credentials in the runtime secret.
  SMTP_HOST: email-smtp.ap-southeast-2.amazonaws.com
  SMTP_PORT: '587'
  SMTP_FROM: BlakPath <no-reply@blakpath.yumait.au>
  # PaperBoy replaces direct SES SMTP in production; key lives in Secrets
  # Manager. Sender contract: POST {PAPERBOY_URL}/api/v1/emails, Bearer auth.
  PAPERBOY_URL: https://paperboy.yumait.au
  # SES permanent-bounce and complaint topic. Must match the live topic.
  # EMAIL_WEBHOOK_SECRET stays in Secrets Manager and is sent as the
  # x-email-webhook-secret header, not in the URL.
  EMAIL_SNS_TOPIC_ARN: arn:aws:sns:ap-southeast-2:959038055523:blakpath-email-events
  CLAMAV_HOST: blakpath-clamav
  CLAMAV_PORT: '3310'
  AI_FEATURES_ENABLED: 'false'
  MCP_RATE_LIMIT_PER_MINUTE: '60'
  OTEL_SERVICE_NAME: blakpath
