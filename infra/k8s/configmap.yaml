apiVersion: v1
kind: ConfigMap
metadata:
  name: blakpath-config
  namespace: blakpath
data:
  APP_URL: https://blakpath.yumait.au
  APP_REGION: ap-southeast-2
  BETTER_AUTH_URL: https://blakpath.yumait.au
  HOSTNAME: 0.0.0.0
  PORT: '3000'
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: '1'
  LOG_LEVEL: info
  S3_REGION: ap-southeast-2
  S3_BUCKET_EVIDENCE: blakpath-prod-evidence-959038055523-ap-southeast-2
  S3_BUCKET_QUARANTINE: blakpath-prod-quarantine-959038055523-ap-southeast-2
  S3_KMS_KEY_ID: arn:aws:kms:ap-southeast-2:959038055523:key/737b7098-2c77-4a4e-b4c6-666597743651
  S3_FORCE_PATH_STYLE: 'false'
  # The one production sender: SES v2 API in ap-southeast-2 under the
  # workload role (no SMTP, no static mail credentials). The configuration
  # set publishes bounce/complaint events via SNS to /api/email/events.
  # See docs/adr/0090-production-email-sender.md and infra/aws/ses-sending.example.yaml.
  EMAIL_TRANSPORT: ses
  SES_CONFIGURATION_SET: blakpath-production
  SMTP_FROM: BlakPath <no-reply@blakpath.yumait.au>
  CLAMAV_HOST: blakpath-clamav
  CLAMAV_PORT: '3310'
  AI_FEATURES_ENABLED: 'false'
  OTEL_SERVICE_NAME: blakpath
