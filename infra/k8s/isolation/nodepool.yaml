# Apply only with infra/k8s/isolation/nodeclass.yaml on blakpath-prod.
# The CPU limit is a cost ceiling. Raising it is a spend change.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: blakpath
spec:
  template:
    metadata:
      labels:
        blakpath.yumait.au/node-pool: private
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: blakpath-private
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ['amd64']
        - key: karpenter.sh/capacity-type
          operator: In
          values: ['on-demand']
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: ['c', 'm', 'r']
        - key: eks.amazonaws.com/instance-generation
          operator: Gt
          values: ['5']
  limits:
    cpu: '8'
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s
