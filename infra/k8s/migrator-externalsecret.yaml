# Sync the migration credential only. Do not add DATABASE_MIGRATION_URL to
# /blakpath/production/runtime — web and worker mount that secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blakpath-migrator
  namespace: blakpath
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: blakpath-migrator
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: /blakpath/production/migrator
