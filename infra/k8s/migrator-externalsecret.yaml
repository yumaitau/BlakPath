# Migrator credential. Mounted only by the migrate Job, never by web or worker.
# Secrets Manager JSON at /blakpath/production/migrator:
#   {"DATABASE_MIGRATOR_URL":"postgres://blakpath_migrator:…@host:5432/blakpath?sslmode=verify-full"}
# Create that secret out of band. Do not put this key in /blakpath/production/runtime.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blakpath-migrator
  namespace: blakpath
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: blakpath-migrator
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: /blakpath/production/migrator
