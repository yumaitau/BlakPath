# EXAMPLE ONLY — never commit real secrets. Copy to secret.yaml (git-ignored)
# for local kind testing, or prefer ExternalSecret (externalsecret.yaml).
# The release gate rejects these placeholders. It also rejects SMTP_USER,
# SMTP_PASSWORD, PILOT_BOOTSTRAP_TOKEN, COA_SIGNING_LOCAL_KEY_PEM, and static
# S3 keys.
apiVersion: v1
kind: Secret
metadata:
  name: blakpath-runtime-secret
  namespace: blakpath
type: Opaque
stringData:
  DATABASE_URL: postgres://blakpath:CHANGEME@rds-endpoint.ap-southeast-2.rds.amazonaws.com:5432/blakpath?sslmode=verify-full
  REDIS_URL: rediss://elasticache-endpoint.ap-southeast-2:6379
  BETTER_AUTH_SECRET: CHANGEME-min-32-chars-not-a-real-secret
  ENCRYPTION_MASTER_KEY: CHANGEME-base64-32-bytes
  PAPERBOY_API_KEY: CHANGEME-paperboy-api-key
  EMAIL_WEBHOOK_SECRET: CHANGEME-webhook-shared-secret
  COA_SIGNING_KEY_ID: arn:aws:kms:ap-southeast-2:123456789012:key/00000000-0000-0000-0000-000000000000
