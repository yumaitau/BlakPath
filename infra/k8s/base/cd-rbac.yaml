# AmazonEKSEditPolicy cannot read ExternalSecrets. The CD role uses this
# binding only to confirm the runtime secret path before migrate.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blakpath-cd-secret-path
  namespace: blakpath
rules:
  - apiGroups: ['external-secrets.io']
    resources: ['externalsecrets']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blakpath-cd-secret-path
  namespace: blakpath
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blakpath-cd-secret-path
subjects:
  - kind: User
    name: arn:aws:iam::959038055523:role/blakpath-github-cd
    apiGroup: rbac.authorization.k8s.io
