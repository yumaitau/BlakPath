# Namespaced store for /blakpath/<environment>/*. Other namespaces cannot
# reference this object. The service account exchanges an IRSA token whose
# subject is system:serviceaccount:<namespace>:blakpath-external-secrets.
# Replace nothing here: the overlay sets the role ARN on the service account.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: blakpath-secrets
  namespace: blakpath
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: blakpath-external-secrets
