# Environment-neutral base. Apply an overlay, not this directory.
# Account ids, bucket names, key ARNs and the image registry are tokens
# that the overlays and scripts/eks-deploy.sh fill in. See docs/eks-runbook.md.
#
# Rollouts go through scripts/eks-deploy.sh. That script applies
# overlays/<environment>/release-check, then the release-pinned migrate Job,
# and applies overlays/<environment> only after both Jobs exit 0. Applying an
# overlay alone skips the gate and the migration.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blakpath
resources:
  - configmap.yaml
  - serviceaccounts.yaml
  - secretstore.yaml
  - externalsecret.yaml
  - migrator-externalsecret.yaml
  - web-deployment.yaml
  - worker-deployment.yaml
  - clamav.yaml
  - clamav-mirror.yaml
  - service-ingress.yaml
  - network-policy.yaml
  - autoscaling.yaml
