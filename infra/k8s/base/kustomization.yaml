# Environment-neutral base. Apply an overlay, not this directory.
# Account id, bucket names and KMS key ARNs are supplied at deploy time.
# See docs/eks-runbook.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blakpath
resources:
  - configmap.yaml
  - serviceaccounts.yaml
  - externalsecret.yaml
  - web-deployment.yaml
  - worker-deployment.yaml
  - service-ingress.yaml
  - autoscaling.yaml
