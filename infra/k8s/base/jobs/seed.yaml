# Catalogue seed: permission catalogue + system role templates only.
# Developer bootstrap is refused when NODE_ENV=production (see src/db/seeds).
# Render infra/k8s/overlays/<environment>/jobs (docs/eks-runbook.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: blakpath-seed
  namespace: blakpath
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: blakpath
      restartPolicy: Never
      containers:
        - name: seed
          image: blakpath/worker:unset
          imagePullPolicy: IfNotPresent
          command: [pnpm, exec, tsx, src/db/seeds/index.ts]
          envFrom:
            - configMapRef:
                name: blakpath-config
            - secretRef:
                name: blakpath-runtime
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
