# Catalogue seed: permission catalogue + system role templates only.
# Developer accounts require ALLOW_DEV_SEED=1 and a loopback database host.
# NODE_ENV=production never creates them (see src/db/seeds).
# Render infra/k8s/overlays/<environment>/jobs (docs/eks-runbook.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: blakpath-seed
  namespace: blakpath
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blakpath-job
    spec:
      serviceAccountName: blakpath-migrate
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: seed
          image: blakpath/worker:unset
          imagePullPolicy: IfNotPresent
          command: [pnpm, exec, tsx, src/db/seeds/index.ts]
          envFrom:
            - configMapRef:
                name: blakpath-config
            - secretRef:
                name: blakpath-runtime
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - mountPath: /tmp
              name: tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
