# One-shot migration. Not part of the main overlay. Render
# infra/k8s/overlays/<environment>/jobs (docs/eks-runbook.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: blakpath-migrate
  namespace: blakpath
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: blakpath
      restartPolicy: Never
      containers:
        - name: migrate
          image: blakpath/worker:unset
          imagePullPolicy: IfNotPresent
          command: [pnpm, exec, tsx, src/db/migrate.ts]
          envFrom:
            - configMapRef:
                name: blakpath-config
            - secretRef:
                name: blakpath-runtime
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
