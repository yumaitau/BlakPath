# Provision one organisation. Humans apply this. Do not commit real names or
# email addresses: replace every REPLACE_* value and give the Job a unique
# name per slug (blakpath-provision-<slug>) before apply.
#
# Requires the migrate and seed Jobs to have completed (permission catalogue
# and system role templates). The operator email must belong to a platform
# operator account. The command is idempotent on slug. It emails the first
# administrator through SES and does not print a password or invitation token.
# The operator is not granted a tenant membership. It runs with the app
# database role from blakpath-runtime (DATABASE_URL), never the migrator.
# Production needs --confirm-production repeating the slug.
#
# Later, as separate one-off Jobs with the same image, env and pod settings,
# record checklist items, the signed agreement reference, and activation:
#   pnpm exec tsx scripts/provision-organisation.ts readiness --slug ... --item consent_wording --complete true --operator-email ... --confirm-production ...
#   pnpm exec tsx scripts/provision-organisation.ts agreement --slug ... --reference MSA-... --signed-at YYYY-MM-DD --operator-email ... --confirm-production ...
#   pnpm exec tsx scripts/provision-organisation.ts activate --slug ... --operator-email ... --confirm-production ...
# Activation is refused until the tenant key is active and validated, every
# checklist item is recorded, and the agreement is recorded.
#
#   see "Hand-applied jobs" in docs/eks-runbook.md (image and namespace).
# NOT in kustomization.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: blakpath-provision-REPLACE_SLUG
  namespace: blakpath
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        # Same egress as invite-admin: Postgres, SES, KMS/STS. See
        # network-policy.yaml (blakpath-admin-job-egress).
        app.kubernetes.io/name: blakpath-admin-job
    spec:
      # Sends the invitation through SES, so it runs as the web identity
      # (Pod Identity role blakpath-web), like invite-admin.
      serviceAccountName: blakpath-web
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: provision-organisation
          image: blakpath/worker:unset
          imagePullPolicy: IfNotPresent
          command:
            - pnpm
            - exec
            - tsx
            - scripts/provision-organisation.ts
            - provision
            - --legal-name
            - REPLACE_LEGAL_NAME
            - --slug
            - REPLACE_SLUG
            - --type
            - council
            - --admin-email
            - REPLACE_ADMIN_EMAIL
            - --operator-email
            - REPLACE_OPERATOR_EMAIL
            - --confirm-production
            - REPLACE_SLUG
          envFrom:
            - configMapRef:
                name: blakpath-config
            - secretRef:
                name: blakpath-runtime
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - mountPath: /tmp
              name: tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
