# EXAMPLE ONLY — never commit real secrets. Copy to secret.yaml (git-ignored)
# for local kind testing, or prefer ExternalSecret (externalsecret.yaml).
# Deployed namespaces: blakpath (production) and blakpath-staging.
# The name matches the Secret the web and worker envFrom blocks read.
apiVersion: v1
kind: Secret
metadata:
  name: blakpath-runtime
  namespace: blakpath
type: Opaque
stringData:
  # Hostname must be the RDS or RDS Proxy DNS name (certificate SAN), with verify-full.
  DATABASE_URL: postgres://blakpath_app:CHANGEME@rds-endpoint.ap-southeast-2.rds.amazonaws.com:5432/blakpath?sslmode=verify-full
  # AUTH token from /blakpath/<environment>/redis-auth (no username).
  REDIS_URL: rediss://:CHANGEME@elasticache-endpoint.ap-southeast-2:6379
  BETTER_AUTH_SECRET: CHANGEME-min-32-chars
  # Optional. Only for reading version-1 ciphertext. New writes use KMS.
  # ENCRYPTION_MASTER_KEY: CHANGEME-base64-32-bytes
  # Header x-email-webhook-secret on POST /api/email/events. Not a URL parameter.
  EMAIL_WEBHOOK_SECRET: CHANGEME-webhook-shared-secret
  # KMS asymmetric audit anchor signing key ARN.
  AUDIT_ANCHOR_SIGNING_KEY_ID: CHANGEME-audit-anchor-kms-key-arn
  ORIGIN_VERIFY_SECRET: CHANGEME-min-32-chars-origin-verify
  # KMS asymmetric CoA signing key ARN or alias. COA_SIGNING_LOCAL_KEY_PEM is refused.
  COA_SIGNING_KEY_ID: CHANGEME-coa-signing-kms-key-arn
  # Optional: federated sign-in (Entra ID). Omit all three to keep SSO off.
  # SSO_ENTRA_CLIENT_ID: CHANGEME-entra-app-client-id
  # SSO_ENTRA_CLIENT_SECRET: CHANGEME-entra-app-client-secret
  # SSO_STATE_SECRET: CHANGEME-min-32-chars-dedicated
---
# Migration owner. Apply separately from the runtime secret. Never copy
# DATABASE_MIGRATION_URL into blakpath-runtime.
apiVersion: v1
kind: Secret
metadata:
  name: blakpath-migrator
  namespace: blakpath
type: Opaque
stringData:
  DATABASE_MIGRATION_URL: postgres://blakpath_migrator:CHANGEME@rds-endpoint.ap-southeast-2.rds.amazonaws.com:5432/blakpath?sslmode=verify-full
