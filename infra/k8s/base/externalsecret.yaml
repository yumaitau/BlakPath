# External Secrets Operator: sync the Secrets Manager JSON secret into the
# runtime Secret consumed by web + worker via envFrom. Secret keys must match
# env var names exactly (DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET,
# ENCRYPTION_MASTER_KEY, SMTP_USER, SMTP_PASSWORD, PAPERBOY_API_KEY,
# EMAIL_WEBHOOK_SECRET, COA_SIGNING_KEY_ID).
#
# Overlays set the path to /blakpath/<environment>/runtime. The Kubernetes
# Secret name stays blakpath-runtime. Account ids and KMS key ARNs are not
# committed; CD substitutes them at apply time (docs/eks-runbook.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blakpath-runtime
  namespace: blakpath
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: blakpath-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: REPLACE_VIA_OVERLAY
