apiVersion: apps/v1
kind: Deployment
metadata:
  name: blakpath-worker
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blakpath-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blakpath-worker
    spec:
      serviceAccountName: blakpath-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      # tsx/esbuild scratch. HOME is /tmp so a read-only root has one writable path.
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: worker
          image: blakpath/worker:unset
          imagePullPolicy: IfNotPresent
          command: [pnpm, exec, tsx, worker/index.ts]
          envFrom:
            - configMapRef:
                name: blakpath-config
            - secretRef:
                name: blakpath-runtime
          # Explicit env wins over envFrom. 33 = 11 queues × concurrency 3.
          env:
            - name: HOME
              value: /tmp
            - name: BLAKPATH_PROCESS
              value: worker
            - name: DATABASE_WORKER_POOL_MAX
              value: '33'
          volumeMounts:
            - mountPath: /tmp
              name: tmp
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
