apiVersion: apps/v1
kind: Deployment
metadata:
  name: blakpath-app
  namespace: blakpath
  labels:
    app.kubernetes.io/name: blakpath-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blakpath-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blakpath-app
    spec:
      # 15s preStop plus 25s for the process to exit. The kubelet clock
      # includes the sleep. See src/db/connection-budget.ts.
      terminationGracePeriodSeconds: 40
      serviceAccountName: blakpath-web
      # Hard spread: min 2 replicas need two AZs and two nodes, or the second
      # pod stays Pending. Do not relax whenUnsatisfiable.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: blakpath-app
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: blakpath-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
      containers:
        - name: web
          image: blakpath/app:unset
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: blakpath-config
            - secretRef:
                name: blakpath-runtime
          # Overrides envFrom. The runtime secret must not raise the pool.
          env:
            - name: DATABASE_POOL_MAX
              valueFrom:
                configMapKeyRef:
                  name: blakpath-config
                  key: DATABASE_POOL_MAX
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /app/.next/cache
              name: next-cache
          # Hold the process until ALB deregistration (15s) finishes.
          lifecycle:
            preStop:
              exec:
                command: [/bin/sh, -c, 'sleep 15']
          # Slow boot is a startup failure, not a liveness restart. Dependency
          # loss fails readiness only — /api/live does not touch RDS, Redis, S3
          # or ClamAV, so a blip cannot restart the web tier.
          startupProbe:
            httpGet:
              path: /api/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
