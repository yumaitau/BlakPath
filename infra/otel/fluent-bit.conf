[SERVICE]
    Flush         5
    Grace         30
    Log_Level     info
    Parsers_File  /fluent-bit/parsers/parsers.conf

# CRI log files are named <pod>_<namespace>_<container>-<id>.log.
# The namespace segment keeps other workloads out of this log group.
[INPUT]
    Name              tail
    Tag               blakpath.*
    Path              /var/log/containers/*_blakpath_*.log
    Parser            cri
    DB                /var/fluent-bit/state/flb.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10

# Production pino writes one JSON object per line. Parsing it makes $.signal
# visible to the CloudWatch metric filters.
[FILTER]
    Name          parser
    Match         blakpath.*
    Key_Name      log
    Parser        json
    Reserve_Data  On

[OUTPUT]
    Name                cloudwatch_logs
    Match               blakpath.*
    region              ap-southeast-2
    log_group_name      /blakpath/production/application
    log_stream_prefix   eks-
    auto_create_group   false
